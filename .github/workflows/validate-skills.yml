---
name: validate-skills

# zizmor: pinned action SHA + no persisted credentials (read-only checkout)
"on":
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
      - "**/eval/**"
      - "scripts/validate-skills.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval/**"
      - "scripts/validate-skills.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # cachix/install-nix-action v31.11.2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      # nix-community/cache-nix-action v7.0.2 (cache /nix/store, keyed flake.lock)
      - uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes: nix-${{ runner.os }}-
      - run: nix flake check --print-build-logs
